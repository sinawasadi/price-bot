name: قیمت‌ها

on:
  schedule:
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"
  workflow_dispatch:
    inputs:
      summary:
        description: "ارسال فوری جمع‌بندی شبانه (فقط برای تست)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: نصب کتابخانه
        run: pip install requests

      - name: ارسال قیمت‌ها به کانال
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
        run: python3 price_bot.py --once ${{ inputs.summary && '--summary' || '' }}

      - name: ذخیره شناسه پیام
        if: always()
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "price-bot"
            git config user.email "price-bot@users.noreply.github.com"
            git add state.json
            git commit -m "save message id"
            git push
          fi
