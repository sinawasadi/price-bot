name: قیمت‌ها

on:
  schedule:
    - cron: "*/5 * * * *"   # هر ۵ دقیقه
  workflow_dispatch:         # دکمه‌ی اجرای دستی

permissions:
  contents: write

concurrency:
  group: prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: نصب کتابخانه
        run: pip install requests

      - name: روشن کردن سرویس قیمت
        run: |
          docker run -d --name tgju -p 8080:8080 ghcr.io/amiranmanesh/tgju-api-go:latest
          for i in $(seq 1 30); do
            curl -fs http://localhost:8080/healthz && break
            sleep 2
          done

      - name: ارسال قیمت‌ها به کانال
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
        run: python3 price_bot.py --once

      - name: ذخیره شناسه پیام
        if: always()
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "price-bot"
            git config user.email "price-bot@users.noreply.github.com"
            git add state.json
            git commit -m "save message id"
            git push
          fi
